[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-ingestion-service"
version = "0.1.0"
description = "FastAPI IoT Data Ingestion & Streaming Service"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Anubhav Koul" }
]
dependencies = [
  "fastapi==0.135.2",
  "uvicorn[standard]==0.42.0",
  "pymongo==4.16.0",
  "redis[hiredis]==7.4.0",
  "pydantic-settings==2.13.1",
  "PyJWT==2.12.1",
  "pwdlib[argon2]==0.3.0"
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
